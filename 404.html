<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AHMED MAHMOUD PH</title>
  <script>
    // GitHub Pages serves this file (with a 404 status) for any URL that
    // isn't a real file — which, for a single-page app, is every route
    // except the bare site root (/wedding-ahmed-sara, /admin, /work, …).
    //
    // This page never renders the app itself. It just re-encodes the
    // intended path into a query string and redirects to the real
    // index.html, which decodes it back (see the matching script in
    // index.html) before the router ever looks at the URL. This is the
    // standard, battle-tested fix for SPA routing on GitHub Pages
    // (https://github.com/rafgraph/spa-github-pages) — it works no matter
    // how deep the path is or whether it has a trailing slash, which a
    // simpler "guess the base from the current URL" approach does not.
    //
    // segmentsToKeep MUST match CONFIG.PATH_SEGMENTS_TO_KEEP in
    // src/config.ts:
    //   1 → a GitHub *project* page (https://username.github.io/repo-name/…) — the default
    //   0 → a GitHub *user/org* page (repo named username.github.io) or a custom domain at its root
    var segmentsToKeep = 1;

    var loc = window.location;
    var segments = loc.pathname.split("/").filter(Boolean);
    var base = segments.slice(0, segmentsToKeep);
    var route = segments.slice(segmentsToKeep).join("/");

    var redirectUrl =
      loc.origin +
      "/" + (base.length ? base.join("/") + "/" : "") +
      "?p=/" + route +
      (loc.search ? "&" + loc.search.slice(1) : "") +
      loc.hash;

    loc.replace(redirectUrl);
  </script>
</head>
<body>
  <noscript>
    <p>AHMED MAHMOUD PH — please enable JavaScript to view this site.</p>
  </noscript>
</body>
</html>
